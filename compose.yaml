services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${API_PORT:-8000}:${PORT:-8000}"
    environment:
      PORT: "${PORT:-8000}"
      CORS_ORIGINS: "${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,https://scrapping-version1.vercel.app}"
      SCRAPER_HEADLESS: "true"
      CHROMIUM_NO_SANDBOX: "true"
      JOBAPPLY_DATA_DIR: /app/data
    volumes:
      - jobapply_data:/app/data
    shm_size: "1gb"
    init: true
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: "${VITE_API_URL:-http://127.0.0.1:8000}"
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  jobapply_data:
